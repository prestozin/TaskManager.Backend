name: Tests

on:
  push:
    branches:
      - tests/coverage-85
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore test project
        run: dotnet restore TaskManager.Tests/TaskManager.Tests.csproj

      - name: Run tests with coverage
        run: dotnet test TaskManager.Tests/TaskManager.Tests.csproj --no-restore --collect:"XPlat Code Coverage"
